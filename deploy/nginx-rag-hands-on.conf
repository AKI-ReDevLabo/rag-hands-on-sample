# Nginx からチャットUIへ中継する。第7章「systemd と Nginx で本番化する」。
#
#   sudo cp deploy/nginx-rag-hands-on.conf /etc/nginx/conf.d/rag-hands-on.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 社内LAN向けの最小構成。HTTPS にする場合は listen 443 ssl と証明書の設定を足す。

server {
    listen 80;
    server_name rag.example.internal;   # 社内の DNS 名に置き換える

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 回答生成は数十秒かかることがある。既定の60秒だと長い回答で 504 になる
        proxy_read_timeout 180s;
    }
}
